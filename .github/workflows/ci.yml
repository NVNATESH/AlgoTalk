name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel earlier in-flight runs on the same ref so PR pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Stage 1: Lint, Typecheck, Unit Tests ───────────────────────────
jobs:
  backend-unit:
    name: "Backend: Install → Typecheck → Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Unit test coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: backend/coverage/
          retention-days: 14

  backend-build:
    name: "Backend: Build"
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  frontend:
    name: "Frontend: Install → Typecheck → Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: npm run build

  # ─── Stage 2: E2E Tests (Docker Compose) ────────────────────────────
  e2e:
    name: "E2E: Docker Compose → API Tests"
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Start services (MongoDB + Backend)
        run: docker compose -f docker-compose.ci.yml up -d --build --wait
        timeout-minutes: 5

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5050/api/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              break
            fi
            echo "Attempt $i/30 — waiting 3s..."
            sleep 3
          done
          curl -sf http://localhost:5050/api/health || (echo "Backend failed to start" && docker compose -f docker-compose.ci.yml logs backend-ci && exit 1)

      - name: Install test dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run E2E tests
        working-directory: backend
        env:
          E2E_BASE_URL: http://localhost:5050/api
        run: npm run test:e2e

      - name: E2E test coverage
        if: always()
        working-directory: backend
        env:
          E2E_BASE_URL: http://localhost:5050/api
        run: npm run test:e2e:coverage || true

      - name: Upload E2E coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: backend/coverage/
          retention-days: 14

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --tail=100

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ─── Stage 3: Docker Image Build (Smoke) ────────────────────────────
  docker:
    name: "Docker: Build Images"
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: algotalk-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: algotalk-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─── Stage 4: Deploy Gate ───────────────────────────────────────────
  deploy-gate:
    name: "Deploy: Ready"
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment gate passed
        run: |
          echo "✅ All stages passed — ready to deploy."
          echo "Pipeline summary:"
          echo "  • Unit tests: passed (144 tests)"
          echo "  • Frontend build: passed"
          echo "  • E2E tests: passed (Docker Compose)"
          echo "  • Docker images: built successfully"
          echo ""
          echo "To add deployment, add your deploy steps here."
          echo "Examples: docker push, SSH deploy, Vercel deploy, etc."
