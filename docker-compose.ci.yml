# Docker Compose for CI / E2E testing.
# Spins up MongoDB + backend so E2E tests can hit a real API.
#
# Usage (CI):
#   docker compose -f docker-compose.ci.yml up -d --wait
#   cd backend && npm run test:e2e
#   docker compose -f docker-compose.ci.yml down -v

services:
  mongo-ci:
    image: mongo:7
    restart: "no"
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db          # RAM-backed for speed; data is throwaway
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-ci:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      mongo-ci:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - PORT=5000
      - MONGO_URI=mongodb://mongo-ci:27017/learnhub_test
      - JWT_ACCESS_SECRET=ci-test-access-secret-64chars-0123456789abcdef0123456789abcdef
      - JWT_REFRESH_SECRET=ci-test-refresh-secret-64chars-0123456789abcdef0123456789abcdef
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - CORS_ORIGIN=http://localhost:3000
      - MAIL_TRANSPORT=console
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
