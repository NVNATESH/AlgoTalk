# AlgoTalk local development stack.
#
# Usage:
#   docker compose up --build
#
# Brings up:
#   - mongo:    local Mongo (data persisted in `mongo-data` volume)
#   - backend:  Express + TypeScript (Dockerfile at backend/Dockerfile)
#   - frontend: Next.js 14 in standalone mode (Dockerfile at frontend/Dockerfile)
#
# Notes:
# - Production deploys typically use Atlas / Neon / managed Mongo and *don't*
#   need this `mongo` service. Override via `docker compose --profile prod`.
# - Backend listens on :5000 inside the network and is exposed to host on :5000.
# - Frontend listens on :3000.
# - The frontend connects to the backend via `NEXT_PUBLIC_API_URL` — set it in
#   `.env` at the repo root or pass via `--env-file`.

services:
  mongo:
    image: mongo:7
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      # Inside the compose network the backend reaches Mongo by service name.
      # Override this in production to point at Atlas / Neon / etc.
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/learnhub}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in backend/.env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in backend/.env}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        ["CMD-SHELL",
         "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"

volumes:
  mongo-data:
