<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LearnHub Capture</title>
    <style>
      body {
        font: 13px/1.4 -apple-system, Segoe UI, sans-serif;
        background: #0f0f17;
        color: #e6e6f0;
        margin: 0;
        padding: 16px;
        width: 280px;
      }
      h1 { font-size: 14px; margin: 0 0 12px; }
      label { display: block; margin-bottom: 4px; font-size: 11px; color: #9999b0; text-transform: uppercase; letter-spacing: .05em; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        color: #fff;
        font: inherit;
      }
      .row { margin-bottom: 12px; }
      button {
        width: 100%;
        padding: 8px;
        background: #a78bfa;
        border: 0;
        border-radius: 8px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #9b7af0; }
      .ok { color: #34d399; }
      .err { color: #f87171; }
      #status { margin-top: 8px; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>🎯 LearnHub Capture</h1>
    <div class="row">
      <label for="baseUrl">LearnHub URL</label>
      <input id="baseUrl" type="text" placeholder="http://localhost:5000" />
    </div>
    <div class="row">
      <label for="pairingToken">Pairing token</label>
      <input id="pairingToken" type="password" placeholder="from /settings → integrations" />
    </div>
    <button id="save">Save</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
